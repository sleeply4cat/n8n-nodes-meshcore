# Publishes n8n-nodes-meshcore to npm when a version tag (vX.Y.Z) is pushed.
#
# Threat model — what this workflow is built to rule out:
#  - No pull_request / pull_request_target / workflow_run trigger. Only a tag push, which
#    needs write access to the repo, can start it; nothing from a fork ever runs here.
#  - No long-lived npm token exists anywhere. npm Trusted Publishing exchanges this
#    job's short-lived GitHub OIDC token for a one-off publish credential, and npm only
#    accepts it from this repo, this workflow file and the `npm` environment.
#  - Dependency code never runs next to the publish credential. `build` installs,
#    tests and packs with a read-only token and no id-token permission; `publish` does
#    not check out or install anything — it only uploads the tarball `build` produced.
#  - The `npm` environment requires a manual approval before `publish` starts.
#  - Actions are pinned to commit SHAs (a moved tag cannot swap their code), the
#    checkout does not persist its token, and no `${{ }}` expression is interpolated
#    into a shell script — values reach scripts through `env:` only.
#
# One-time setup (repo admin / npm owner):
#  1. npmjs.com → package settings → Trusted Publisher → GitHub Actions:
#       owner `sleeply4cat`, repository `n8n-nodes-meshcore`,
#       workflow `publish.yml`, environment `npm`.
#     Then under "Publishing access" choose "Require two-factor authentication and
#     disallow tokens", so no token — leaked or not — can publish.
#  2. GitHub → Settings → Environments → `npm`: add yourself as a required reviewer,
#     and limit deployment branches and tags to the tag pattern `v*`.
#  3. GitHub → Settings → Rules → new tag ruleset for `v*`: restrict creation,
#     update and deletion to admins.
#
# Releasing: bump the version in a `Release vX.Y.Z` commit, `git tag vX.Y.Z`,
# `git push origin main vX.Y.Z`, then approve the `npm` deployment in the Actions tab.

name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22: the toolchain the project is built and tested with (isolated-vm@6, a dev
      # dependency, does not compile on Node 26).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # never restore a cache into a release build: a poisoned cache entry would
          # flow straight into the published tarball
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Pack
        run: |
          npm pack
          ls -l ./*.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # Trusted Publishing + provenance; nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      # Node 24 for its bundled npm: Trusted Publishing needs npm >= 11.5.1. Nothing is
      # installed or built in this job, so the build's Node version does not matter here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check npm supports Trusted Publishing
        run: |
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error("::error::npm " + process.argv[1] + " is older than 11.5.1");
              process.exit(1);
            }' "$(npm --version)"

      # --ignore-scripts: the package's own lifecycle scripts (prepublishOnly etc.) are
      # for local use and must not run here.
      - name: Publish
        run: npm publish ./*.tgz --provenance --ignore-scripts

      # When the Trusted Publishing exchange fails, npm logs the reason only at verbose
      # level and falls through to a bare ENEEDAUTH. Surface those lines (they carry no
      # credentials) from its debug log.
      - name: Show why Trusted Publishing failed
        if: failure()
        run: grep -h 'oidc' ~/.npm/_logs/*-debug-*.log || echo 'no oidc lines in the npm debug log'
